const key=x=>[x.doc||x.n,x.f,x.h,x.p].join('|'),done=new Set(out.filter(x=>x.src==='HISTORICO'||x.src==='AUSENTISMO').map(x=>x.doc+'|'+x.f));
const base=S.imp.tests.filter(x=>!out.some(o=>key(o)===key(x)));
let all=base.concat(out.filter(x=>!(x.src==='PROG'&&done.has(x.doc+'|'+x.f)))),seen=new Set();all=all.filter(x=>{const k=key(x)+'|'+x.src;if(seen.has(k))return false;seen.add(k);return true;});
if(PL.length){if(S.role==='admin'||S.role==='analista'||!API)await plSubir(PL,log);else log.push('La base de vencimientos solo la puede cargar el administrador o el analista.');}
const RS=out.filter(x=>x.src==='HISTORICO'||x.src==='AUSENTISMO');
if(API&&RS.length){const by={};RS.forEach(x=>{(by[x.p]=by[x.p]||[]).push(x);});
for(const p of Object.keys(by)){if(isP()&&p!==S.role){log.push('Se omitieron '+by[p].length+' pruebas de '+(PN[p]||p)+': solo puedes cargar tu propia base.');continue;}
const j=await api('/api/resultados/importar',{poligrafista:p,filas:by[p],reemplazar:true}).catch(()=>({}));
log.push(j.ok?'Base de resultados de '+(PN[p]||p)+' guardada en la base de datos: '+j.guardados+' pruebas (reemplaza la carga anterior de '+(PN[p]||p)+').':'No se pudo guardar la base de '+(PN[p]||p)+': '+(j.error||'sin conexión')+'.');}
S.imp.tests=all.filter(x=>x.src==='PROG');saveImp();await resCargar();}
else if(all.length){S.imp.tests=all;applyImp();saveImp();}
S.imp.log=log;S.imp.busy=false;render();}
async function resCargar(){if(!API||!S.user)return;try{const j=await api('/api/resultados');if(!j.ok)return;S.resSrv=j.resumen||[];S.ult={};(j.ultimas||[]).forEach(u=>{S.ult[ck(u.cc)]=u;});const prog=(S.imp.tests||[]).filter(x=>x.src==='PROG');
const T=(j.pruebas||[]).concat(prog);if(T.length){S.imp.tests=T;applyImp();S.imp.tests=prog;}render();}catch(e){}}
function applyImp(){if(!S.imp.tests.length)return;TODAY=iso(new Date());WK0=mondayOf(TODAY);WK1=addD(WK0,5);S.dd=TODAY;S.cd=TODAY;S.rs=S.rs;S.form.f=addD(TODAY,1);S.rf.val.f=S.rf.arq.f=S.rf.cgm.f=TODAY;const keep=S.tests.filter(t=>t.app);S.tests=S.imp.tests.map((x,i)=>Object.assign({},x,{id:i+1})).concat(keep);}
function saveImp(){try{localStorage.setItem('poli_imp',JSON.stringify(API?S.imp.tests.filter(x=>x.src==='PROG'):S.imp.tests));}catch(e){S.imp.log.push('Aviso: los datos son muy grandes para guardarse en este navegador; se perderán al recargar.');}}
function loadImp(){try{const v=JSON.parse(localStorage.getItem('poli_imp')||'null');if(v&&v.length){S.imp.tests=v;v.forEach(x=>{if(x.ciudad&&!CITY[x.ciudad])CITY[x.ciudad]=x.p;});applyImp();}}catch(e){}}
function vImp(){const T=S.tests.filter(x=>x.imp),c=(a)=>T.filter(a).length,ad=S.role==='admin'||S.role==='analista'||isP();
return '<div class="card"><h3>Vincular bases reales</h3><p class="mut">Selecciona tus archivos de Excel: <b>Base de resultados</b> (hojas HISTORICO y AUSENTISMO), <b>Programación de polígrafías</b> (hojas por poligrafista) y/o la <b>Base de vencimientos</b> (de ella se toman CONTRATO, REGIONAL, CLIENTE, C.C y los demás datos de planta, cruzados por cédula). '+(API?'Las bases de <b>resultados</b> y de <b>vencimientos</b> se guardan en la base de datos privada de la app (nunca en GitHub); la programación semanal se lee solo en este navegador.':'Los datos se leen solo en este navegador.')+'</p>'+(API&&!isP()?'<p class="note" style="margin:0 0 12px">Datos de planta vinculados: <b>'+S.plInfo.total+'</b> funcionarios'+(S.plInfo.actualizado?' · actualizados el '+new Date(S.plInfo.actualizado).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+(S.plInfo.total&&ad?' · <button type="button" class="lk" data-act="plclr" style="display:inline;width:auto;margin:0">Borrar datos de planta</button>':'')+'</p>':'')+
(isP()&&API?'<p class="note" style="margin:0 0 12px">Carga aquí <b>tu propia base de resultados</b> (hojas HISTORICO y AUSENTISMO). Cada carga reemplaza la anterior y queda guardada para el administrador y el analista.</p>':'')+(API&&S.resSrv&&S.resSrv.length&&!isP()?'<p class="note" style="margin:0 0 12px">Bases de resultados guardadas: '+S.resSrv.map(z=>'<b>'+esc(PN[z.poligrafista]||z.poligrafista)+'</b> '+z.n+' pruebas ('+fmt(String(z.desde).slice(0,10))+' – '+fmt(String(z.hasta).slice(0,10))+')').join(' · ')+'</p>':'')+(ad?'<label class="btn" style="display:inline-flex;align-items:center;justify-content:center;padding:0 18px;cursor:pointer">Elegir archivos Excel<input id="impf" type="file" accept=".xlsx,.xlsm" multiple hidden></label>':'<p class="note">Solo administrador y analista pueden importar.</p>')+
(T.length&&(!API||S.imp.tests.some(x=>x.src==='PROG'))?' <button type="button" class="btn" data-act="impclr" style="background:var(--card);color:var(--ink)">Borrar datos importados</button>':'')+'</div>'+
(S.imp.log.length?'<div class="card"><h3>Resultado de la importación</h3>'+S.imp.log.map(l=>'<div class="fm">'+esc(l)+'</div>').join('')+'</div>':'')+
(T.length?'<div class="card sc"><h3>Datos cargados en esta sesión</h3>'+tbl(['Poligrafista','Realizadas','Ausentes','Programadas','Primera fecha','Última fecha'],PS.map(q=>{const t=T.filter(x=>x.p===q).map(x=>x.f).sort();return [PN[q],c(x=>x.p===q&&x.e==='Realizada'),c(x=>x.p===q&&x.e==='Ausente'),c(x=>x.p===q&&x.e==='Programada'),t[0]?fmt(t[0]):'—',t.length?fmt(t[t.length-1]):'—'];}))+'<p class="mut">Los vencimientos se recalculan por documento desde la última prueba realizada (Control y otras: 12 meses; Preempleo: 6 meses; Inconclusa igual que Aprobó, como en la base).</p></div>':'');}
loadImp();
document.addEventListener('change',e=>{if(e.target&&e.target.id==='impf'&&e.target.files.length)importFiles([...e.target.files]);});

render();
apiIniciar();
</script>
