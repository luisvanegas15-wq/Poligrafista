function parseResults(wb,fname,out,log){let n=0;
[['HISTORICO','Realizada'],['AUSENTISMO','Ausente']].forEach(([sn,est])=>{const ws=wb.Sheets[sn];if(!ws)return;const R=rowsOf(ws);R.slice(1).forEach(r=>{const nm=String(r[3]||'').trim(),doc=String(r[4]||'').trim(),f=nd(r[12])||(r[2]&&r[1]&&r[0]?r[2]+'-'+String(r[1]).padStart(2,'0')+'-'+String(r[0]).padStart(2,'0'):'');
if(!nm||!f||/^#/.test(nm))return;const p=pOf(r[11]||fname)||'P3',res=String(r[8]||'').trim(),ciudad=tcase(r[6]);if(!CITY[ciudad])CITY[ciudad]=p;
let mo=String(r[7]||'').trim().toUpperCase(),t=mo==='CONTROL'?'Control':mo==='PREEMPLEO'?'Preempleo':mo==='ESPECIFICA'||mo==='ESPECÍFICA'?'Específica':tcase(mo)||'Control';
const rr=/^aprob/i.test(res)?'Aprobó':/^no aprob/i.test(res)?'No aprobó':/inconclus/i.test(res)?'Inconcluso':'';
let e=est==='Ausente'?'Ausente':rr?'Realizada':/suspend/i.test(res)?'Suspendida':/ausent/i.test(res)?'Ausente':'Realizada';
const adm=String(r[10]||'').trim();
out.push({imp:1,n:nm,doc,cargo:tcase(r[5]),ciudad,f,h:sn==='HISTORICO'?nh(r[16]):'',hf:sn==='HISTORICO'?nh(r[17]):'',t,p,e,r:rr,l:'',adm:/^sin |^n\/a$/i.test(adm)?'':adm,obs:String(r[15]||'').trim(),re:/^n\/a$/i.test(String(r[9]||'').trim())?'':String(r[9]||'').trim(),pdf:r[13]||'',src:sn});n++;});});
log.push(fname+': '+n+' pruebas (resultados y ausentes)');}
function parseWeekly(wb,fname,out,log){let n=0;wb.SheetNames.forEach(sn=>{const p=pOf(sn);if(!p)return;const R=rowsOf(wb.Sheets[sn]);let f='';
for(let i=0;i<R.length;i++){const r=R[i]||[],a=String(r[1]||'').trim().toUpperCase();
if(a==='FECHA'){f=nd(r[2]);continue;}if(a==='HORA'||!f)continue;
const h=nh(r[1]);if(!h||!r[3]||!String(r[3]).trim())continue;

out.push({imp:1,n:String(r[3]).trim(),doc:String(r[2]||'').trim(),cargo:tcase(r[4]),l:tcase(r[5]),t:/preemp/i.test(r[6])?'Preempleo':/espec/i.test(r[6])?'Específica':tcase(r[6])||'Control',ciudad:ciudad||CIT(p)[0]||'',f,h,p,e:'Programada',r:'',adm:'',obs:'',src:'PROG'});n++;}});
log.push(fname+': '+n+' citas de programación semanal');}
async function importFiles(files){const out=[],log=[];S.imp.busy=true;
for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
if(wb.Sheets['HISTORICO'])parseResults(wb,f.name,out,log);else if(wb.SheetNames.some(s=>pOf(s)))parseWeekly(wb,f.name,out,log);else log.push(f.name+': sin hojas reconocidas (HISTORICO / hojas por poligrafista). Pendientes se recalculan desde resultados.');}catch(e){log.push(f.name+': no se pudo leer ('+(e&&e.message||e)+')');}}

let all=base.concat(out.filter(x=>!(x.src==='PROG'&&done.has(x.doc+'|'+x.f)))),seen=new Set();all=all.filter(x=>{const k=key(x)+'|'+x.src;if(seen.has(k))return false;seen.add(k);return true;});
