.sl button.sel,.btn,.tb button.on{background:var(--br);color:var(--brt);font-weight:700}

.btn{padding:0 18px;margin-top:12px}.sm{min-height:36px;padding:0 12px;font-size:12px;margin:0}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tb button{padding:0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}

.ct th,.ct td{border:1px solid var(--line);padding:4px;vertical-align:top;min-width:118px;white-space:normal}
.ct td.t{min-width:50px;color:var(--mut);font-size:12px}.ct th.hoy{background:var(--okb);color:var(--ok)}
.ev{border-radius:6px;padding:6px;font-size:12px;line-height:1.35;min-height:44px;box-sizing:border-box}

.add{width:100%;min-height:44px;border:1px dashed var(--line);background:none;color:var(--mut);border-radius:6px;cursor:pointer}
.chk{width:20px;height:20px}.btn:disabled{opacity:.5;cursor:not-allowed}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:780px;margin:40px auto;width:100%}.sb .out{margin-top:6px;min-height:36px;border:1px solid #D7E0E4;border-radius:8px;color:#fff;font-size:12px;text-align:center}

form:{tipo:'Preempleo',n:'',doc:'',cargo:'',l:'Líder A',ciudad:'Envigado',f:'2026-10-29',h:'',adm:''},

rec:{val:[{p:'P3',f:'2026-10-27',o:'Oficina A',ini:'09:00',fin:'11:30',d:45,obs:'Sin hallazgos relevantes.',ev:'foto1.jpg'}],
arq:[{p:'P2',f:'2026-10-27',o:'Oficina D',who:'Poligrafista 2',ced:'00.000.000',pres:'Funcionario 15',enc:1200000,sis:1250000,nov:'Faltante',ini:'14:00',fin:'15:30',d:60,pdf:'arqueo_d.pdf'}],
cgm:[{p:'P1',f:'2026-10-27',tipo:'Apoyo CGM',ini:'08:00',fin:'12:00',d:30}]}};
S.tests.forEach((x,i)=>x.id=i+1);
['2026-10-26','2026-10-27','2026-10-28','2026-10-29'].forEach(f=>S.rec.cgm.push({p:'P2',f,tipo:'Apoyo CGM',ini:'08:00',fin:'18:00',d:30}));
const FC={val:[['o','Oficina a validar','text'],['f','Fecha','date'],['ini','Hora de inicio','time'],['fin','Hora de finalización','time'],['d','Desplazamiento (min, no efectivo)','number'],['obs','Análisis de lo observado','area'],['ev','Foto de evidencia','file']],
arq:[['o','Oficina','text'],['f','Fecha del arqueo','date'],['who','Quien realiza el arqueo','text'],['ced','Cédula','text'],['pres','Quien presencia','text'],['enc','Saldo encontrado','number'],['sis','Saldo de sistema','number'],['nov','Novedad','sel',['Sin novedad','Faltante','Sobrante']],['ini','Hora de inicio','time'],['fin','Hora de finalización','time'],['d','Desplazamiento (min)','number'],['pdf','PDF del arqueo','file'],['atm','Evidencia ATM (si tiene)','file']],
cgm:[['f','Fecha','date'],['tipo','Tipo de apoyo','text'],['ini','Hora de inicio','time'],['fin','Hora de finalización','time'],['d','Desplazamiento (min, no efectivo)','number'],['obs','Observaciones','area'],['sop','Soporte (PDF o foto)','file']]};
const MC={dash:'#14B8A6',cal:'#3B82F6',diaria:'#8B5CF6',resumen:'#EC4899',prog:'#F59E0B',res:'#22C55E',venc:'#EF4444',val:'#06B6D4',arq:'#F97316',cgm:'#6366F1',form:'#84CC16',usr:'#94A3B8'};

const dot=v=>'<i class="dot" style="background:'+MC[v]+'"></i>',pad=s=>s.length<5?'0'+s:s;
const dlh=()=>({save:async o=>{const b=new Blob([o.data],{type:'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}});
const money=n=>'$ '+Number(n).toLocaleString('es-CO');
const COLS={val:[['Fecha',r=>fmt(r.f)],['Oficina',r=>esc(r.o)],['Poligrafista',r=>PN[r.p]],['Horario',r=>r.ini+'–'+r.fin],['Evidencia',r=>r.ev?esc(r.ev):'—']],
arq:[['Fecha',r=>fmt(r.f)],['Oficina',r=>esc(r.o)],['Poligrafista',r=>PN[r.p]],['Diferencia',r=>money(r.enc-r.sis)],['Novedad',r=>pill(r.nov==='Sin novedad'?'ok':'bad',r.nov)],['Horario',r=>r.ini+'–'+r.fin]],
cgm:[['Fecha',r=>fmt(r.f)],['Poligrafista',r=>PN[r.p]],['Tipo',r=>esc(r.tipo||'—')],['Horario',r=>r.ini+'–'+r.fin],['Desplazamiento',r=>(r.d||0)+' min']]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const addM=(s,n)=>{const d=D(s);d.setMonth(d.getMonth()+n);return iso(d)};
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>D(s).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'});

function vis(){let t=S.tests.slice();const r=S.role;if(r==='th')t=t.filter(x=>x.t==='Preempleo'&&x.e==='Realizada');else if(isP())t=t.filter(x=>x.p===r);else if(r==='lider')t=[];return t.sort((a,b)=>a.f.localeCompare(b.f));}
function vrows(){const last={};S.tests.filter(x=>x.e==='Realizada').forEach(x=>{if(!last[x.doc]||x.f>last[x.doc].f)last[x.doc]=x;});

const dur=(a,b)=>{const m=s=>{const q=s.split(':');return +q[0]*60+ +q[1]};return Math.max(0,m(b)-m(a))/60};
const inW=r=>r.f>=WK0&&r.f<=WK1;
function stats(p){const ts=S.tests.filter(x=>x.p===p),due=ts.filter(x=>x.f<=TODAY),ok=due.filter(x=>x.e==='Realizada').length,wt=ts.filter(x=>inW(x)&&(x.e==='Programada'||x.e==='Realizada'));
const rc=['val','arq','cgm'].map(g=>S.rec[g].filter(r=>r.p===p&&inW(r)));const all=[].concat(rc[0],rc[1],rc[2]);
return{pct:due.length?Math.round(100*ok/due.length):0,ok,n:due.length,h:wt.length*1.5+all.reduce((a,r)=>a+dur(r.ini,r.fin),0),dz:all.reduce((a,r)=>a+(+r.d||0),0)/60,pol:wt.length,v:rc[0].length,a:rc[1].length,c:rc[2].length,aus:ts.filter(x=>x.e==='Ausente'||x.e==='Suspendida').length};}
function chartBars(it,max,lim,unit){const W=360,H=190,L=30,B=28,T=18,n=it.length,step=(W-L-8)/n,bw=Math.min(54,step-16),y=v=>T+(H-T-B)*(1-Math.min(v,max)/max);
let o='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfica de barras">';
[0,.5,1].forEach(f=>{const v=max*f,yy=y(v);o+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+Math.round(v)+'</text>';});

if(lim){const yy=y(lim);o+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+yy+'" y2="'+yy+'" stroke="#EF4444" stroke-dasharray="4 3"/><text x="'+(W-4)+'" y="'+(yy-4)+'" text-anchor="end" font-size="10" fill="var(--bad)">Límite '+lim+unit+'</text>';}

function gauge(pct,c){const C=2*Math.PI*52;return '<svg viewBox="0 0 140 140" width="140" role="img" aria-label="Cumplimiento '+pct+'%"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="70" cy="70" r="52" fill="none" stroke="'+c+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(C*pct/100)+' '+C+'" transform="rotate(-90 70 70)"/><text x="70" y="77" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">'+pct+'%</text></svg>';}

function vCharts(ps){const poli=ps.length===1,p=poli?ps[0]:null,days=[0,1,2,3,4,5].map(i=>({l:DN[i],v:S.tests.filter(x=>x.f===addD(WK0,i)&&(!p||x.p===p)&&x.e!=='Reprogramar').length,c:'#3B82F6'})),dm=Math.max(4,...days.map(d=>d.v)),mx=mix(p),mm=Math.max(4,...mx.map(d=>d.v));

document.getElementById('sb').innerHTML='<h1>Suite de Poligrafía</h1>'+m.map(v=>'<button type="button" data-act="nav" data-v="'+v+'"'+(v===S.view?' class="on"':'')+'>'+dot(v)+LBL[v]+'</button>').join('')+'<label>Sesión iniciada<b style="color:#fff;font-size:13px">'+esc(S.user[1])+'</b><button type="button" class="out" data-act="logout">Cerrar sesión</button></label>';
const v=S.view,V=v==='dash'?vDash():v==='cal'?vCal():v==='prog'?vProg():v==='res'?vRes():v==='venc'?vVenc():v==='form'?vForm():v==='usr'?vUsr():v==='diaria'?vDia():v==='resumen'?vResumen():vRec(v);
document.getElementById('app').style.setProperty('--mc',MC[v]);document.getElementById('app').innerHTML='<div><h2>'+dot(v)+LBL[v]+'</h2><span class="mut">'+INFO[kind()]+'</span></div>'+(S.msg?'<div class="note">'+S.msg+'</div>':'')+V;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
if(a==='nav'){S.view=d.v;S.msg='';S.closing=0;}
else if(a==='slot')S.form.h=d.h;
else if(a==='wk')S.wk=d.n==='0'?0:S.wk+ +d.n;
else if(a==='cp')S.cp=d.p;
else if(a==='cell'){S.form.f=d.d;S.form.h=d.h;S.form.ciudad=CIT(d.p)[0];S.view='prog';S.msg='';}
else if(a==='close'){S.closing=+d.id;S.cl={r:'Aprobó',obs:'',adm:''};S.msg='';}
else if(a==='cancelc')S.closing=0;
else if(a==='vf')S.vf=d.k;
else if(a==='toprog'){S.queue=vrows().filter(o=>S.sel[o.x.doc]).map(o=>({n:o.x.n,doc:o.x.doc,cargo:o.x.cargo,l:o.x.l,ciudad:o.x.ciudad,nx:o.nx}));S.sel={};S.view='prog';S.msg='';ql(0);}
else if(a==='qload')ql(+d.i);
else if(a==='xls'){xls();return;}
else if(a==='dxls'){dxls();return;}
else if(a==='rxls'){rxls();return;}
else if(a==='rcopy'){rcopy();return;}
else if(a==='login'){doLogin();return;}
else if(a==='fill'){S.lf.u=d.u;S.lf.p=PASS;S.lf.e='';}
else if(a==='logout'){S.user=null;S.msg='';}
else if(a==='rs')S.rs=d.p;
else if(a==='dnot'){const n=S.tests.filter(x=>x.f===S.dd&&x.e!=='Reprogramar').length;S.msg='Notificación enviada al administrador (simulado): programación del '+fmt(S.dd)+' de los 3 poligrafistas, '+n+' pruebas, con el Excel adjunto.';}
else if(a==='rsend'){const q=isP()?S.role:S.rs;S.msg='Resumen de '+PN[q]+' del '+fmt(S.dd)+' enviado al administrador y al analista (simulado): '+dayAct(q,S.dd).length+' actividades.';}
else if(a==='cerrar'){const x=S.tests.find(t=>t.id===S.closing),c=S.cl;
if(c.r==='Suspendida'&&!c.obs.trim())S.msg='Escribe las observaciones para suspender la prueba.';
else{x.obs=c.obs.trim();if(c.adm)x.adm=c.adm;if(['Aprobó','No aprobó','Inconcluso'].includes(c.r)){x.e='Realizada';x.r=c.r;}else{x.e=c.r;x.r='';}
S.msg='Prueba cerrada como «'+c.r+'».'+(c.r==='Reprogramar'?' El horario quedó libre en el calendario.':'');S.closing=0;}}
else if(a==='prog'){const F=S.form;if(!F.n.trim()||!F.h){S.msg='Falta el nombre del evaluado o elegir un horario.';}
else{S.tests.push({id:S.tests.length+1,n:F.n.trim(),doc:F.doc||'—',cargo:F.cargo||'—',ciudad:F.ciudad,f:F.f,h:F.h,t:F.tipo,p:CITY[F.ciudad],e:'Programada',r:'',l:F.l,adm:F.adm,obs:''});
S.mails.unshift('Para: '+F.l+' y Talento Humano · Confirmación: '+esc(F.n.trim())+' · '+fmt(F.f)+' '+F.h+' · '+F.ciudad+' · Adjuntos: autorización y PDF de recomendaciones · Evento creado en el calendario');
S.msg='Prueba agendada con '+PN[CITY[F.ciudad]]+'. Ya aparece en el calendario.';S.queue=S.queue.filter(q=>q.doc!==F.doc);F.n='';F.doc='';F.cargo='';F.h='';F.adm='';ql(0);}}
else if(a==='rec'){const g=d.g,R=S.rf[g],o={};if(!R.f||!R.ini||!R.fin){S.msg='Faltan la fecha o las horas de inicio y fin.';render();return;}
FC[g].forEach(z=>{o[z[0]]=R[z[0]]||(z[2]==='sel'?z[3][0]:'');});o.p=isP()?S.role:(Object.keys(PN).find(k=>PN[k]===R.p)||'P1');
S.rec[g].push(o);S.rf[g]={f:TODAY};S.msg='Registro guardado; las horas ya cuentan en el dashboard de cumplimiento.';}
render();});
function setv(e){const t=e.target,d=t.dataset;if(d&&d.s!==undefined){if(e.type==='change'){const vs=vrows().filter(o=>S.vf==='all'||vst(o)===S.vf);if(d.s==='all')vs.forEach(o=>{S.sel[o.x.doc]=t.checked});else S.sel[d.s]=t.checked;render();}return;}if(d&&d.l){S.lf[d.l]=t.value;return;}if(d&&d.d){if(e.type==='change'&&t.value){S[d.d]=t.value;render();}return;}if(t.id==='role'){S.role=t.value;S.msg='';S.closing=0;render();return;}if(!d)return;
const v=t.type==='file'?(t.files[0]?t.files[0].name:''):t.value;
if(d.g){S.rf[d.g][d.f]=v;return;}
if(d.c){S.cl[d.c]=v;if(d.c==='r'&&e.type==='change')render();return;}
if(d.f){S.form[d.f]=v;if(e.type==='change'&&['ciudad','f','tipo'].includes(d.f)){S.form.h='';render();}}}
document.addEventListener('input',setv);document.addEventListener('change',setv);
async function xls(){const all=vrows().filter(o=>S.vf==='all'||vst(o)===S.vf),pick=all.filter(o=>S.sel[o.x.doc]),rows=(pick.length?pick:all).slice().sort((a,b)=>a.x.l.localeCompare(b.x.l)||a.d-b.d);
const H=['Líder','Funcionario','Documento','Cargo','Ciudad','Zona','Poligrafista','Última prueba','Resultado','Próximo vencimiento','Estado','Disponibilidad del líder (fecha y hora)','Observaciones'];
const A=rows.map(o=>[o.x.l,o.x.n,o.x.doc,o.x.cargo,o.x.ciudad,ZONA[o.x.p],PN[o.x.p],o.x.t+' · '+o.x.f,o.x.r,o.nx,o.d<0?'Vencida':o.d<=30?'Próxima a vencer':'Vigente','','']);
try{const dl=await dlh();if(!dl){S.msg='La descarga no está disponible en esta vista.';render();return;}
let name='vencimientos_2026-10-27',data;
if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([H].concat(A));ws['!cols']=H.map(()=>({wch:24}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Vencimientos');data=XLSX.write(wb,{bookType:'xlsx',type:'array'});name+='.xlsx';}
else{data=String.fromCharCode(65279)+[H].concat(A).map(r=>r.map(c=>'"'+String(c).split('"').join('""')+'"').join(';')).join(String.fromCharCode(10));name+='.csv';}
await dl.save({filename:name,data:data});S.msg='Archivo listo: '+rows.length+' funcionarios, ordenados por líder.';}
catch(err){S.msg=err&&err.code==='declined'?'Descarga cancelada.':'No se pudo descargar el archivo en esta vista.';}
render();}
render();
</script>
